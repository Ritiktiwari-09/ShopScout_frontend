<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
    <link rel="stylesheet" href="forms.css"> 
    
</head>
<body> 

  
     <form action="/submit.php">  <!--submit.php is a place where the form data will be sent for processing. You can change this to your desired endpoint. -->
      <div>

            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter name" required>
</div>
        <div>
            <label for="NUMBER">Phone</label>
            <input id="NUMBER" type="tel" placeholder="Enter Phone" maxlength="10" required>
        </div>
        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter Email">
        </div>

        <DIV>
            <label for="pan number">Pan Number</label>
        <input type="text" name="pan" id="pan" maxlength="10" pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}" placeholder="Enter valid PAN number (e.g., ABCDE1234F)" required>

</DIV>

        <div>
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter New Password" required>
        </div>

        <div>
            <label for="confirm-password"> Confirm Password</label>
            <input id="confirm-password" type="password" placeholder="Re enter Password" required>
        </div>
     <label for="gst">GST Number</label>
<input id="gst" type="text" maxlength="15"
pattern="[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}"
placeholder="Enter valid GST number (e.g., 24ABCDE1234F1Z5)" required>

        <div>
            <label for="dob">Date of Birth</label>
            <input id="dob" type="date" required>
        </div>
        <div>
            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div>
            <input id="terms" type="checkbox" required>
            <label for="terms">I agree to the terms and conditions</label>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>
        
    </form>
    
</body>
</html>
