<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopScout - Login</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>ShopScout</h1>
            <h2>Login</h2>
            <p>Enter your details to continue</p>

            <form id="loginForm">

                <!-- Name -->
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <!-- Send OTP Button -->
                <button type="button" class="login-btn" id="sendOtpButton">
                    Send OTP
                </button>

                <!-- OTP Section -->
                <div class="otp-section" id="otpSection">

                    <div class="input-group">
                        <label for="otp">Enter OTP</label>
                        <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6">
                    </div>

                    <a href="index.html" class="login-btn">
    Login
</a>

                </div>

            </form>

            <a href="page.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </div>

    <script src="form.js"></script>

</body>

</html>
